[project]
name = "smriti-backend"
version = "0.1.0"
description = "SMRITI (eRTMAC-NWIS, SIH PS 121) backend: offset-well knowledge and decision support API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<7.0",
    "celery>=5.4,<6.0",
    "boto3>=1.34,<2.0",
    "typer>=0.12,<1.0",
    "python-multipart>=0.0.9",
    "numpy>=2.4.6",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "fpdf2>=2.8.8",
    "pyproj>=3.7.2",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[s3]>=1.34",
    "celery-types>=0.22",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the docker compose stack running (run with: pytest -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/db/migrations/**" = ["N999", "E501"]
# Report templates and generated-data tables read better unwrapped.
"app/synthetic/**" = ["E501"]
"scripts/**" = ["E501", "S608"]
# Formula modules keep the textbook notation (σ, ρ, ×, −) in docs and labels.
"app/physics/**" = ["RUF001", "RUF002", "RUF003"]
"app/risk/**" = ["RUF001", "RUF002", "RUF003"]
"app/ledger/**" = ["RUF001", "RUF002", "RUF003"]
"app/api/v1/schemas/knowledge.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true
