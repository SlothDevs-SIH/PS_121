name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend — lint, types, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: API contract matches the frontend's committed copy
        run: |
          uv run python -m app.cli openapi --out "$RUNNER_TEMP/openapi.json"
          diff -u ../frontend/src/lib/api/openapi.json "$RUNNER_TEMP/openapi.json" || {
            echo "::error::Backend API changed. Run: cd backend && uv run python -m app.cli openapi && cd ../frontend && npm run gen:api"
            exit 1
          }

  frontend-checks:
    name: Frontend — lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are up to date
        run: npm run check:api
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Full stack — docker compose, backend integration + browser e2e
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose build --build-arg GIT_SHA=${GITHUB_SHA::7}
          docker compose up -d --wait --wait-timeout 240
      - name: Integration tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -m integration
      - name: CLI check (inside the worker container)
        run: docker compose exec -T worker python -m app.cli check --worker
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser end-to-end tests (Playwright, through nginx)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
