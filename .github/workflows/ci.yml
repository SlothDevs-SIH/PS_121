name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend — lint, types, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  backend-integration:
    name: Backend — docker compose stack + integration tests
    runs-on: ubuntu-latest
    needs: backend-checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose build --build-arg GIT_SHA=${GITHUB_SHA::7}
          docker compose up -d --wait --wait-timeout 240
      - name: Integration tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest -m integration
      - name: CLI check (inside the worker container)
        run: docker compose exec -T worker python -m app.cli check --worker
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
