# SMRITI local stack — backend phase B0, frontend phase F0.
#   cp .env.example .env && docker compose up -d --build --wait
# Web app: http://localhost:8080 (nginx serves the SPA and proxies /api, /ws, /healthz, /readyz).
# Profiles (B6): `--profile jwt` adds the app with local-user login on :8081; `--profile oidc`
# adds Keycloak on :8180 and the app with single sign-on on :8082 (demo realm in
# infra/keycloak/). Both share the default stack's database and object store.
# `--profile observability` adds Prometheus on :9090 and Grafana on :3000 (dashboards in
# infra/grafana/), scraping the api, worker and stream services.

name: smriti

x-backend-env: &backend-env
  SMRITI_ENV: ${SMRITI_ENV:-dev}
  SMRITI_LOG_LEVEL: ${SMRITI_LOG_LEVEL:-INFO}
  SMRITI_LOG_JSON: ${SMRITI_LOG_JSON:-true}
  SMRITI_AUTH_MODE: ${SMRITI_AUTH_MODE:-dev}
  # The API is reached through the frontend's nginx, which sets X-Real-IP (the API port is
  # published on 127.0.0.1 only).
  SMRITI_TRUST_PROXY_HEADERS: "true"
  SMRITI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smriti}:${POSTGRES_PASSWORD:-smriti}@postgres:5432/${POSTGRES_DB:-smriti}
  SMRITI_REDIS_URL: redis://redis:6379/0
  SMRITI_S3_ENDPOINT_URL: http://s3:8333
  SMRITI_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smriti}
  SMRITI_S3_SECRET_KEY: ${S3_SECRET_KEY:-smriti-secret}
  SMRITI_S3_BUCKET_RAW: ${SMRITI_S3_BUCKET_RAW:-smriti-raw}
  SMRITI_S3_BUCKET_PAGES: ${SMRITI_S3_BUCKET_PAGES:-smriti-pages}

services:
  postgres:
    # PostgreSQL 16.15 with TimescaleDB 2.30.1, PostGIS 3.6.4, pgvector 0.8.6, pg_trgm (verified 2026-09-28)
    image: timescale/timescaledb-ha:pg16.15-ts2.30.1@sha256:4f288c0a521362cad799f265bc0ebd60c3f8f98596b850172cc2da72883420ff
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smriti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smriti}
      POSTGRES_DB: ${POSTGRES_DB:-smriti}
    volumes:
      - pgdata:/home/postgres/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible object store (Apache-2.0). MinIO's Docker Hub image was not pullable on 2026-09-28.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smriti}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-smriti-secret}
    volumes:
      - ./infra/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - s3data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      # Any HTTP answer from the S3 gateway (even 403 for anonymous) means it is up.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./backend
    image: smriti-backend:dev
    command: ["python", "-m", "app.cli", "bootstrap"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: "no"

  api:
    image: smriti-backend:dev
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: smriti-backend:dev
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "INFO",
              "-Q", "default,ingest,extract", "--concurrency", "2"]
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  stream:
    # S12/S9: replay + WITS0 publishers, persistence, scoring and the alert engine.
    image: smriti-backend:dev
    command: ["python", "-m", "app.stream.run"]
    environment: *backend-env
    healthcheck:
      # The service refreshes a heartbeat key in Redis every second (15 s expiry).
      test: ["CMD", "python", "-c", "import os, sys, redis; sys.exit(0 if redis.Redis.from_url(os.environ['SMRITI_REDIS_URL']).exists('stream:heartbeat') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: smriti-frontend:dev
    environment:
      API_UPSTREAM: http://api:8000
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # ─── B6: the same app with real authentication (profiles) ─────────────────────────
  api-jwt:
    profiles: ["jwt"]
    image: smriti-backend:dev
    environment:
      <<: *backend-env
      SMRITI_AUTH_MODE: jwt
      # Local testing only; set a real secret (>= 32 chars) anywhere else.
      SMRITI_JWT_SECRET: ${SMRITI_JWT_SECRET:-local-only-jwt-secret-change-me-0123456789}
    ports:
      - "127.0.0.1:${API_JWT_PORT:-8001}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  frontend-jwt:
    profiles: ["jwt"]
    image: smriti-frontend:dev
    environment:
      API_UPSTREAM: http://api-jwt:8000
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN:-}
    ports:
      - "127.0.0.1:${WEB_JWT_PORT:-8081}:80"
    depends_on:
      api-jwt: { condition: service_healthy }
    restart: unless-stopped

  keycloak:
    profiles: ["oidc"]
    image: keycloak/keycloak:26.4@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-kcadmin-local-only}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}  # tokens' "iss" is always this
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # the API reaches it as keycloak:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/smriti-realm.json:/opt/keycloak/data/import/smriti-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  api-oidc:
    profiles: ["oidc"]
    image: smriti-backend:dev
    environment:
      <<: *backend-env
      SMRITI_AUTH_MODE: oidc
      SMRITI_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/smriti
      SMRITI_OIDC_AUDIENCE: smriti-web
      SMRITI_OIDC_JWKS_URL: http://keycloak:8080/realms/smriti/protocol/openid-connect/certs
      SMRITI_OIDC_TOKEN_URL: http://keycloak:8080/realms/smriti/protocol/openid-connect/token
    ports:
      - "127.0.0.1:${API_OIDC_PORT:-8002}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    restart: unless-stopped

  frontend-oidc:
    profiles: ["oidc"]
    image: smriti-frontend:dev
    environment:
      API_UPSTREAM: http://api-oidc:8000
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_ORIGIN: ${MAP_TILE_ORIGIN:-}
    ports:
      - "127.0.0.1:${WEB_OIDC_PORT:-8082}:80"
    depends_on:
      api-oidc: { condition: service_healthy }
    restart: unless-stopped

  # ─── B6: metrics (profile) ────────────────────────────────────────────────────────
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command: ["--config.file=/etc/prometheus/prometheus.yml",
              "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Local testing only; set GRAFANA_ADMIN_PASSWORD anywhere else.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local-only}
      # Demo: dashboards are readable without logging in (Viewer role, no editing).
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smriti-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      prometheus: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
  promdata:
  grafanadata:
