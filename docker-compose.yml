# SMRITI local stack — backend phase B0.
#   cp .env.example .env && docker compose up -d --build --wait
# Later phases add (as profiles): llm (Ollama/vLLM), keycloak, frontend, mlflow, grafana/prometheus.

name: smriti

x-backend-env: &backend-env
  SMRITI_ENV: ${SMRITI_ENV:-dev}
  SMRITI_LOG_LEVEL: ${SMRITI_LOG_LEVEL:-INFO}
  SMRITI_LOG_JSON: ${SMRITI_LOG_JSON:-true}
  SMRITI_AUTH_MODE: ${SMRITI_AUTH_MODE:-dev}
  SMRITI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smriti}:${POSTGRES_PASSWORD:-smriti}@postgres:5432/${POSTGRES_DB:-smriti}
  SMRITI_REDIS_URL: redis://redis:6379/0
  SMRITI_S3_ENDPOINT_URL: http://s3:8333
  SMRITI_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smriti}
  SMRITI_S3_SECRET_KEY: ${S3_SECRET_KEY:-smriti-secret}
  SMRITI_S3_BUCKET_RAW: ${SMRITI_S3_BUCKET_RAW:-smriti-raw}
  SMRITI_S3_BUCKET_PAGES: ${SMRITI_S3_BUCKET_PAGES:-smriti-pages}

services:
  postgres:
    # PostgreSQL 16.15 with TimescaleDB 2.30.1, PostGIS 3.6.4, pgvector 0.8.6, pg_trgm (verified 2026-09-28)
    image: timescale/timescaledb-ha:pg16.15-ts2.30.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smriti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smriti}
      POSTGRES_DB: ${POSTGRES_DB:-smriti}
    volumes:
      - pgdata:/home/postgres/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible object store (Apache-2.0). MinIO's Docker Hub image was not pullable on 2026-09-28.
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smriti}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-smriti-secret}
    volumes:
      - ./infra/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
      - s3data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      # Any HTTP answer from the S3 gateway (even 403 for anonymous) means it is up.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./backend
    image: smriti-backend:dev
    command: ["python", "-m", "app.cli", "bootstrap"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: "no"

  api:
    image: smriti-backend:dev
    environment: *backend-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: smriti-backend:dev
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "INFO",
              "-Q", "default,ingest,extract", "--concurrency", "2"]
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
